
[package]
name = "bitlib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num-traits = "0.2.19"
num-bigint = "0.4.6"
primitive-types = "0.13.1"
sha2 = "0.10.8"
ripemd = "0.1.3"
hmac = "0.12.1"
hex-literal = "0.4.1"
ureq = "2.10.1"
lazy_static = "1.5.0"
log = "0.4.22"
env_logger = "0.11.5"
base64 = "0.22.1"
serde = {version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"